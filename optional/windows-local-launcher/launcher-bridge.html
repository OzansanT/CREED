<!-- Optional Windows launcher bridge. Remove with optional/windows-local-launcher/. -->
<style>
  html[data-creed-file-launch="true"] #app { display: none !important; }
  .creed-file-launch {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
    box-sizing: border-box;
    background: #f4f4f8;
    color: #1f1f24;
    font: 14px/1.5 "Segoe UI", sans-serif;
  }
  .creed-file-launch__card {
    width: min(620px, 100%);
    padding: 24px;
    border: 1px solid #d6d6de;
    border-radius: 10px;
    background: #fff;
    box-shadow: 0 12px 36px rgb(0 0 0 / 10%);
  }
  .creed-file-launch__card h1 { margin: 0 0 10px; font-size: 20px; }
  .creed-file-launch__card p { margin: 8px 0; }
  .creed-file-launch__card code { font-family: Consolas, monospace; }
  .creed-file-launch__command {
    margin: 16px 0;
    padding: 14px;
    border: 1px solid #d6d6de;
    border-radius: 8px;
    background: #f8f8fb;
  }
  .creed-file-launch__command strong,
  .creed-file-launch__command span { display: block; }
  .creed-file-launch__secondary { color: #60606a; }
  .creed-file-launch__card button {
    margin-top: 8px;
    padding: 8px 14px;
    border: 1px solid #b8b8c2;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
</style>
<script>
  (() => {
    if (window.location.protocol !== "file:") return;

    document.documentElement.dataset.creedFileLaunch = "true";
    const serverUrl = "http://localhost:8000/";
    const launcherUrl = "creed://start";
    const openLauncher = () => { window.location.href = launcherUrl; };
    const redirectToServer = () => { window.location.replace(serverUrl); };

    const renderFallback = () => {
      const shell = document.createElement("main");
      shell.className = "creed-file-launch";
      shell.innerHTML = `
        <section class="creed-file-launch__card">
          <h1>Open CREED locally</h1>
          <p>CREED JavaScript modules cannot run directly from <code>file://</code>. Checking whether the CREED local server is already available.</p>
          <p data-creed-launch-status role="status">Checking <code>${serverUrl}</code>…</p>
          <div class="creed-file-launch__command">
            <strong>Start CREED</strong>
            <span>When the server is not already running, use the button below to launch CREED through the registered Windows launcher.</span>
          </div>
          <button data-creed-protocol-launch type="button">Start CREED</button>
          <p class="creed-file-launch__secondary">First launch on this Windows account: double-click <code>Start-CREED.cmd</code> once. It registers the <code>creed://</code> launcher, starts the server, and opens CREED. After that, opening <code>index.html</code> can use the button above.</p>
        </section>`;

      const status = shell.querySelector("[data-creed-launch-status]");
      const button = shell.querySelector("[data-creed-protocol-launch]");
      button.addEventListener("click", openLauncher);
      document.body.prepend(shell);

      const probe = document.createElement("link");
      let settled = false;
      const settle = (available) => {
        if (settled) return;
        settled = true;
        probe.remove();
        if (available) {
          status.textContent = "CREED server detected. Opening it now…";
          redirectToServer();
          return;
        }
        status.textContent = "Local server is not running. Click Start CREED to launch it.";
        button.focus({ preventScroll: true });
      };

      probe.rel = "stylesheet";
      probe.media = "not all";
      probe.href = `${serverUrl}css/generated/creed.css?creed-launch-probe=${Date.now()}`;
      probe.addEventListener("load", () => settle(true), { once: true });
      probe.addEventListener("error", () => settle(false), { once: true });
      document.head.append(probe);
      window.setTimeout(() => settle(false), 1200);
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", renderFallback, { once: true });
    } else {
      renderFallback();
    }
  })();
</script>
