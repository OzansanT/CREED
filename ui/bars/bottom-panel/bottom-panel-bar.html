<div id="bottomPanelHeader" class="bottom-panel__header panel__header" data-ui-bar="bottom-panel-bar">
  <div id="bottomPanelTabs" class="bottom-panel__tabs" role="tablist" aria-label="Bottom panel views">
    <button id="problemsTabBtn" class="bottom-panel__tab" type="button" role="tab" aria-selected="false" aria-controls="problemsView" data-panel-view="problems">Sorunlar</button>
    <button id="outputTabBtn" class="bottom-panel__tab" type="button" role="tab" aria-selected="false" aria-controls="outputView" data-panel-view="output">Çıktı</button>
    <button id="debugConsoleTabBtn" class="bottom-panel__tab" type="button" role="tab" aria-selected="false" aria-controls="debugConsoleView" data-panel-view="debugConsole">Hata Ayıklama Konsolu</button>
    <button id="terminalTabBtn" class="bottom-panel__tab is-active" type="button" role="tab" aria-selected="true" aria-controls="terminalView" data-panel-view="terminal">Terminal</button>
    <button id="portsTabBtn" class="bottom-panel__tab" type="button" role="tab" aria-selected="false" aria-controls="portsView" data-panel-view="ports">Bağlantı Noktaları</button>
  </div>
  <div id="bottomPanelToolbar" class="bottom-panel__toolbar toolbar">
    <span class="terminal-view__session"><span data-icon="terminal" aria-hidden="true"></span>bash</span>
    <button id="newTerminalBtn" class="icon-button" data-icon="plus" type="button" aria-label="New terminal" title="New terminal"></button>
    <button id="splitTerminalBtn" class="icon-button" data-icon="split" type="button" aria-label="Split terminal" title="Split terminal"></button>
    <button id="killTerminalBtn" class="icon-button" data-icon="trash" type="button" aria-label="Kill terminal" title="Kill terminal"></button>
    <button class="icon-button" data-icon="more-horizontal" type="button" aria-label="More terminal actions" title="More terminal actions"></button>
    <button id="maximizeBottomPanelBtn" class="icon-button" data-icon="maximize" type="button" aria-label="Maximize panel" aria-pressed="false" title="Maximize panel"></button>
    <button id="closeBottomPanelBtn" class="icon-button" data-icon="close" type="button" aria-label="Close panel" title="Close panel"></button>
  </div>
</div>
