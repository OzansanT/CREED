<div id="workspaceHeader" class="workspace-header" data-ui-bar="workspace-bar">
  <button id="workspaceDisclosureBtn" class="workspace-header__disclosure" type="button" aria-expanded="true" aria-controls="workspaceTree" title="Collapse CREED files">
    <span class="workspace-header__chevron" data-icon="chevron-right" aria-hidden="true"></span>
    <strong class="workspace-header__name">CREED</strong>
    <span class="workspace-header__remote">[Codespaces: friendly fishstick]</span>
  </button>
  <div class="explorer-view__actions" aria-label="Explorer actions">
    <button id="newFileBtn" data-icon="file-plus" type="button" title="New file" aria-label="New file"></button>
    <button id="newFolderBtn" data-icon="folder-plus" type="button" title="New folder" aria-label="New folder"></button>
    <button id="refreshExplorerBtn" data-icon="refresh" type="button" title="Refresh Explorer" aria-label="Refresh Explorer"></button>
    <button data-icon="more-horizontal" type="button" title="More Explorer actions" aria-label="More Explorer actions"></button>
  </div>
</div>
