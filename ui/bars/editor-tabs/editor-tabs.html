<div id="editorTabs" class="editor-panel__header editor-tabs" data-ui-bar="editor-tabs" role="tablist" aria-label="Editor tabs">
  <button id="canvasTab" class="editor-tab editor-tab--canvas is-active" type="button" role="tab" aria-selected="true" aria-controls="canvasView">
    <span class="file-kind" data-icon="infinity" aria-hidden="true"></span>
    <span class="editor-tab__label">Infinite Canvas</span>
  </button>
  <div id="fileTabs" class="editor-tabs__files"></div>
  <div class="editor-actions toolbar">
    <button id="splitEditorBtn" class="icon-button" data-icon="split" type="button" aria-label="Split editor" title="Split editor"></button>
    <button id="editorActionsBtn" class="icon-button" data-icon="more-horizontal" type="button" aria-label="More editor actions" title="More editor actions"></button>
  </div>
</div>
